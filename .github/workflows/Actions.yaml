run-name: spring-action-flow

on: 
  push:
    branches:
      - develop

jobs: 
  CI-Pipeline: 
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn build

      - name: Test with Maven 
        run: mvn test
        
      - name: Package with Maven
        run: mvn package


